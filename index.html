<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI庁舎点検 Ver.2.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.ver{background:#334155;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
main{max-width:760px;margin:auto;padding:18px}.screen{display:none}.screen.active{display:block}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 18px rgba(15,23,42,.09)}
h1{font-size:28px;margin:0 0 8px}h2{font-size:23px;margin:0 0 6px}.sub{color:#64748b;line-height:1.55}
button,label.native{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#0f172a;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.area,.room,.point{background:#fff;text-align:left;box-shadow:0 3px 14px rgba(15,23,42,.09)}
.area{min-height:90px}.area b{font-size:20px}.area small,.room small,.point small{display:block;color:#64748b;margin-top:5px}
.list{display:grid;gap:10px;margin-top:16px}.notice{padding:14px;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:700;margin-top:14px}
video{width:100%;min-height:240px;background:#111827;border-radius:16px;object-fit:cover}.status{padding:10px 12px;margin:10px 0;background:#eff6ff;color:#1e3a8a;border-radius:10px;font-weight:700;font-size:13px}
.native{background:#e2e8f0;text-align:center;margin-top:10px}.native input{display:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>🚒 AI庁舎点検</b><span class="ver">Ver.2.2</span></header>
<main>
<section id="start" class="screen active"><div class="card">
<h1>笠原消防署<br>AI庁舎点検</h1>
<p class="sub">点検エリアから場所を選択して撮影します。</p>
<button id="startBtn" class="primary" type="button">📷 点検を開始する</button>
</div></section>

<section id="areas" class="screen">
<h2>点検エリアを選択</h2><p class="sub">点検する階・場所を選択してください。</p>
<div class="grid">
<button class="area" data-area="1F"><b>🏢 1階</b><small>車庫など</small></button>
<button class="area" data-area="2F"><b>🏢 2階</b><small>点検場所を追加予定</small></button>
<button class="area" data-area="3F"><b>🏢 3階</b><small>点検場所を追加予定</small></button>
<button class="area" data-area="RF"><b>☀️ 屋上</b><small>屋上設備・防水など</small></button>
<button class="area" data-area="P"><b>🚗 駐車場</b><small>点検場所を追加予定</small></button>
<button class="area" data-area="EXT"><b>🧱 外壁</b><small>点検場所を追加予定</small></button>
</div>
<button class="secondary" id="backStart">← スタートへ戻る</button>
</section>

<section id="rooms" class="screen">
<h2 id="roomTitle">場所を選択</h2><p class="sub">点検する場所を選択してください。</p>
<div id="roomList" class="list"></div>
<button class="secondary" id="backAreas">← エリア選択へ戻る</button>
</section>

<section id="points" class="screen">
<h2 id="pointTitle">点検設備</h2><p class="sub">点検する設備・箇所を選択してください。</p>
<div id="pointList" class="list"></div>
<button class="secondary" id="backRooms">← 戻る</button>
</section>

<section id="camera" class="screen">
<h2 id="cameraTitle">撮影</h2><p class="sub">スマホでは「カメラを起動」をタップしてください。</p>
<video id="video" playsinline muted autoplay></video>
<div id="status" class="status">カメラはまだ起動していません。</div>
<button id="cameraBtn" class="primary">📷 カメラを起動</button>
<label class="native">📱 スマホ標準カメラで撮影<input type="file" accept="image/*" capture="environment" id="nativeCamera"></label>
<button class="secondary" id="backPoints">← 点検設備へ戻る</button>
</section>
</main>

<script>
(function(){
"use strict";
var ids=["start","areas","rooms","points","camera"], stream=null, currentArea="", currentRoom="";
var names={"1F":"1階","2F":"2階","3F":"3階","RF":"屋上","P":"駐車場","EXT":"外壁"};
var structure={
 "1F":{"車庫":[["K-05","車庫 点検箇所 K-05"],["K-06","車庫 点検箇所 K-06"],["K-07","車庫天井⑦"],["K-08","車庫 点検箇所 K-08"]]},
 "2F":{},
 "3F":{},
 "RF":{"屋上":[["RF-01","屋上 点検箇所 RF-01"]]},
 "P":{},
 "EXT":{}
};
function show(id){ids.forEach(function(x){document.getElementById(x).className="screen"+(x===id?" active":"")});window.scrollTo(0,0)}
function renderRooms(area){
 currentArea=area; var list=document.getElementById("roomList");list.innerHTML="";
 document.getElementById("roomTitle").textContent=names[area]+"｜場所を選択";
 var rooms=Object.keys(structure[area]||{});
 if(!rooms.length){var d=document.createElement("div");d.className="notice";d.textContent="このエリアの点検場所は、まだ登録されていません。";list.appendChild(d)}
 rooms.forEach(function(room){var b=document.createElement("button");b.className="room";b.innerHTML="<b>🚒 "+room+"</b><small>点検設備を表示</small>";b.onclick=function(){renderPoints(room)};list.appendChild(b)});
 show("rooms");
}
function renderPoints(room){
 currentRoom=room;var list=document.getElementById("pointList");list.innerHTML="";
 document.getElementById("pointTitle").textContent=names[currentArea]+" ＞ "+room+"｜点検設備";
 (structure[currentArea][room]||[]).forEach(function(p){var b=document.createElement("button");b.className="point";b.innerHTML="<b>"+p[0]+"｜"+p[1]+"</b><small>撮影へ進む</small>";b.onclick=function(){document.getElementById("cameraTitle").textContent=names[currentArea]+" ＞ "+room+" ＞ "+p[0];show("camera")};list.appendChild(b)});
 show("points");
}
function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}document.getElementById("video").srcObject=null}
async function camera(){
 var s=document.getElementById("status"),v=document.getElementById("video");stop();s.textContent="カメラを起動しています…";
 if(!window.isSecureContext){s.textContent="⚠ HTTPSのGitHub Pages版から開いてください。";return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){s.textContent="⚠ Webカメラ非対応です。スマホ標準カメラを使用してください。";return}
 var tries=[{audio:false,video:{facingMode:{exact:"environment"}}},{audio:false,video:{facingMode:{ideal:"environment"}}},{audio:false,video:true}],e=null;
 for(var i=0;i<tries.length;i++){try{stream=await navigator.mediaDevices.getUserMedia(tries[i]);v.srcObject=stream;v.setAttribute("playsinline","");await v.play().catch(function(){});s.textContent="✓ カメラを起動しました。";return}catch(x){e=x}}
 s.textContent=e&&e.name==="NotAllowedError"?"⚠ カメラが許可されていません。サイト設定で許可してください。":"⚠ Webカメラを起動できません。スマホ標準カメラを使用してください。";
}
document.getElementById("startBtn").onclick=function(){show("areas")};
document.getElementById("backStart").onclick=function(){show("start")};
document.getElementById("backAreas").onclick=function(){show("areas")};
document.getElementById("backRooms").onclick=function(){show("rooms")};
document.getElementById("backPoints").onclick=function(){stop();show("points")};
document.getElementById("cameraBtn").onclick=camera;
document.querySelectorAll("[data-area]").forEach(function(b){b.onclick=function(){renderRooms(b.getAttribute("data-area"))}});
document.getElementById("nativeCamera").onchange=function(e){if(e.target.files&&e.target.files[0])document.getElementById("status").textContent="✓ スマホ標準カメラから写真を取得しました。"};
window.addEventListener("pagehide",stop);
})();
</script>
</body></html>
