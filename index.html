<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI庁舎点検 Ver.2.5</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}header{background:#0f172a;color:#fff;padding:14px;display:flex;justify-content:space-between}.ver{background:#334155;padding:6px 10px;border-radius:20px}main{max-width:760px;margin:auto;padding:16px}.screen{display:none}.active{display:block}.card,.area,.point{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 12px #0001}button,label{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800}.primary{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.secondary{background:#e2e8f0;margin-top:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:10px}.area,.point{text-align:left}.area small,.point small{display:block;color:#64748b}.cam{position:relative;width:100%;aspect-ratio:3/4;background:#111827;border-radius:18px;overflow:hidden;margin:10px 0}.cam video,.cam img{position:absolute;width:100%;height:100%;object-fit:cover}.cam img{z-index:2;opacity:.42;display:none;pointer-events:none}.status{background:#eff6ff;color:#1e3a8a;padding:11px;border-radius:10px;margin:10px 0;font-weight:700}.file{display:block;background:#e2e8f0;text-align:center;margin-top:9px}.file input{display:none}#review{display:none}#reviewImg{width:100%;max-height:65vh;object-fit:contain;border-radius:16px;background:#111827}.notice{padding:14px;background:#fff7ed;color:#9a3412;border-radius:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><b>🚒 AI庁舎点検</b><span class="ver">Ver.2.5</span></header><main>
<section id="start" class="screen active"><div class="card"><h1>笠原消防署<br>AI庁舎点検</h1><p>前回写真を重ねて同じ構図で撮影します。</p><button class="primary" onclick="show('areas')">📷 点検を開始する</button></div></section>
<section id="areas" class="screen"><h2>点検エリア</h2><div class="grid">
<button class="area" onclick="area('1F')"><b>🏢 1階</b></button><button class="area" onclick="area('2F')"><b>🏢 2階</b></button><button class="area" onclick="area('3F')"><b>🏢 3階</b></button><button class="area" onclick="area('RF')"><b>☀️ 屋上</b><small>RF-01</small></button><button class="area" onclick="area('GARAGE')"><b>🚒 車庫</b><small>K-05〜K-08</small></button><button class="area" onclick="area('EXT')"><b>🧱 外壁</b></button></div></section>
<section id="points" class="screen"><h2 id="pt"></h2><div id="pl" class="list"></div><button class="secondary" onclick="show('areas')">← 戻る</button></section>
<section id="capture" class="screen"><h2 id="ct">撮影</h2><p>前回写真の柱・梁・天井線などが重なるように合わせます。</p>
<div id="live"><div class="cam"><video id="video" playsinline webkit-playsinline autoplay muted></video><img id="overlay"></div>
<div id="status" class="status">① カメラを起動してください。</div>
<button id="camBtn" class="primary">📷 カメラを起動</button>
<label class="file">🖼 前回写真を設定<input id="prev" type="file" accept="image/*"></label>
<p>前回写真の透明度 <input id="opacity" type="range" min="10" max="80" value="42" style="width:100%"></p>
<button id="shot" class="green">📸 この構図で撮影</button><button id="switch" class="secondary">🔄 カメラ切替</button></div>
<div id="review"><h2>撮影写真を確認</h2><img id="reviewImg"><button id="use" class="green">✓ この写真を使用</button><button id="retry" class="secondary">↻ 撮り直す</button><div id="saved" class="status" style="display:none">✓ 今回の点検写真として確定しました。</div></div>
<canvas id="canvas" hidden></canvas><button class="secondary" onclick="stop();show('points')">← 点検設備へ戻る</button></section></main>
<script>
const ss=["start","areas","points","capture"],names={1F:"1階",2F:"2階",3F:"3階",RF:"屋上",GARAGE:"車庫",EXT:"外壁"},data={1F:[],2F:[],3F:[],RF:[["RF-01","屋上 点検箇所 RF-01"]],GARAGE:[["K-05","車庫 点検箇所 K-05"],["K-06","車庫 点検箇所 K-06"],["K-07","車庫天井⑦"],["K-08","車庫 点検箇所 K-08"]],EXT:[]};let stream=null,facing="environment",blob=null;
function show(x){ss.forEach(i=>document.getElementById(i).className="screen"+(i==x?" active":""));scrollTo(0,0)}
function area(a){pt.textContent=names[a]+"｜点検設備";pl.innerHTML="";if(!data[a].length)pl.innerHTML='<div class="notice">まだ点検場所が登録されていません。</div>';data[a].forEach(p=>{let b=document.createElement("button");b.className="point";b.innerHTML="<b>"+p[0]+"｜"+p[1]+"</b><small>撮影へ進む</small>";b.onclick=()=>{ct.textContent=names[a]+" ＞ "+p[0];review.style.display="none";live.style.display="block";show("capture")};pl.appendChild(b)});show("points")}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
async function camera(){stop();status.textContent="カメラを起動しています…";if(!isSecureContext){status.textContent="⚠ HTTPSで開いてください。";return}let last;for(let c of [{audio:false,video:{facingMode:{ideal:facing}}},{audio:false,video:true}]){try{stream=await navigator.mediaDevices.getUserMedia(c);video.srcObject=stream;await video.play();status.textContent="② 前回写真と構図を合わせて撮影してください。";return}catch(e){last=e}}status.textContent=last?.name==="NotAllowedError"?"⚠ カメラ権限を許可してください。":"⚠ 起動失敗："+(last?.name||"不明")}
function shoot(){if(!stream||video.readyState<2||!video.videoWidth){status.textContent="⚠ カメラ映像がまだ準備できていません。";return}canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);canvas.toBlob(b=>{if(!b){status.textContent="⚠ 撮影できませんでした。";return}blob=b;reviewImg.src=URL.createObjectURL(b);live.style.display="none";review.style.display="block";saved.style.display="none";use.disabled=false;use.textContent="✓ この写真を使用";stop();scrollTo(0,0)},"image/jpeg",.92)}
camBtn.onclick=camera;shot.onclick=shoot;switch.onclick=()=>{facing=facing==="environment"?"user":"environment";camera()};prev.onchange=e=>{let f=e.target.files[0];if(f){overlay.src=URL.createObjectURL(f);overlay.style.display="block"}};opacity.oninput=e=>overlay.style.opacity=e.target.value/100;retry.onclick=()=>{review.style.display="none";live.style.display="block";blob=null;camera()};use.onclick=()=>{if(blob){saved.style.display="block";use.disabled=true;use.textContent="✓ 写真確定済み"}};window.addEventListener("pagehide",stop);
</script></body></html>
